# Everything here needs macOS: the scripts use md5, ditto, bspatch, sips and
# iconutil, and the Swift sources need the macOS SDK. Free for public repos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Script tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  compile:
    name: Swift compiles
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make compile
        run: make compile

  # What a user's Mac has: the Command Line Tools, no Xcode. On the macOS 27
  # SDK @State is a macro whose plugin ships only with Xcode, so the jobs above
  # (Xcode, older SDKs) cannot see a @State that breaks this build (#7). The
  # probe proves this runner still reproduces that; if it ever stops, a green
  # run here means nothing and the warning says so.
  compile-clt:
    name: Swift compiles (Command Line Tools, SDK 27)
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::no Command Line Tools at $DEVELOPER_DIR"; exit 1; }
          swiftc --version
          echo "SDK $(xcrun --show-sdk-version)"
      - name: Bare @State still fails here
        run: |
          probe="$RUNNER_TEMP/probe.swift"
          printf 'import SwiftUI\nstruct Probe: View {\n    @State var n = 0\n    var body: some View { Text("\\(n)") }\n}\n' > "$probe"
          if swiftc -swift-version 5 -parse-as-library -typecheck "$probe" 2>/dev/null; then
            echo "::warning::a bare @State compiles on this runner — this job no longer reproduces #7"
          else
            echo "bare @State fails here, as on a CLT-only Mac"
          fi
      - name: make compile
        run: make compile

  strings:
    name: Localization parity
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Also covered by `make test`, but as its own job the red X names the
      # problem without anyone having to read a log.
      - name: make check-strings
        run: make check-strings

  version:
    name: Tag matches the bundle version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with CFBundleShortVersionString
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" assets/Info.plist)
          tag="${GITHUB_REF_NAME#v}"
          echo "Info.plist: $plist   tag: $tag"
          [ "$plist" = "$tag" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist"
            exit 1
          }
